<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep premium rich black/dark-blue obsidian background -->
    <linearGradient id="premiumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14" />
      <stop offset="50%" stop-color="#05060A" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>

    <!-- Glowing cyan neon gradient for cap body and main graphics -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Electric Royal Blue gradient -->
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Gorgeous rich metallic golden tassel gradient -->
    <linearGradient id="metallicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="50%" stop-color="#FFA751" />
      <stop offset="100%" stop-color="#FF512F" />
    </linearGradient>

    <!-- White porcelain board with glossy feedback -->
    <linearGradient id="porcelainWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Ambient glowing drop shadow -->
    <filter id="hyperGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Inner 3D drop shadow -->
    <filter id="depthShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- FULL BLEED BACKGROUND: NO RAW BORDERS, FOR NATIVE CROSS-PLATFORM SYSTEM CLIPPING -->
  <rect x="0" y="0" width="512" height="512" fill="url(#premiumBg)" />

  <!-- Diagonal high-gloss light beam reflection across the background -->
  <path d="M0 0 L512 0 L0 512 Z" fill="#FFFFFF" opacity="0.03" />

  <!-- CENTRAL ICON CONTAINER WITH ADVANCED GLOW & 3D LAYERED DEPTH -->
  <g filter="url(#depthShadow)">
    
    <!-- Deep circular background aura backplate -->
    <circle cx="256" cy="256" r="140" fill="#00F2FE" opacity="0.1" filter="url(#hyperGlow)" />

    <!-- 1. BOLD ENHANCED "M" FRAME (Super-contrasted, very legible at 16x16 or 512x512) -->
    <!-- Left vertical pillar of M -->
    <rect x="140" y="240" width="40" height="135" rx="12" fill="url(#neonCyan)" />
    <!-- Right vertical pillar of M -->
    <rect x="332" y="240" width="40" height="135" rx="12" fill="url(#neonCyan)" />
    
    <!-- Central dipping V element -->
    <path 
      d="M160 240 L256 318 L352 240 L352 290 L256 375 L160 290 Z" 
      fill="url(#neonCyan)" 
    />

    <!-- Deep indigo inner accent to establish shape layering -->
    <path 
      d="M180 240 L256 300 L332 240 L312 240 L256 285 L200 240 Z" 
      fill="#0B132B" 
      opacity="0.6"
    />

    <!-- 2. HIGH QUALITY GRADUATION CAP BASE -->
    <path 
      d="M160 200 Q256 235 352 200 L352 228 Q256 265 160 228 Z" 
      fill="url(#electricBlue)" 
      stroke="#1E40AF" 
      stroke-width="2"
    />

    <!-- 3. GRADUATION CAP DIAMOND UPPER BOARD (Premium high-contrast porcelain white) -->
    <!-- Thick dark shadow band behind the plate -->
    <polygon 
      points="256,88 440,152 256,216 72,152" 
      fill="#04060A" 
      opacity="0.6"
    />
    <!-- The glossy white porcelain top plate -->
    <polygon 
      points="256,80 440,144 256,208 72,144" 
      fill="url(#porcelainWhite)" 
      stroke="#FFFFFF" 
      stroke-width="4"
    />

    <!-- Sleek inner hairline groove detailing on plate -->
    <polygon 
      points="256,95 415,144 256,193 97,144" 
      fill="none" 
      stroke="#E2E8F0" 
      stroke-width="2" 
    />

    <!-- 4. DYNAMIC SOLID GOLD GLOWING TASSEL -->
    <!-- Beautiful hanging path -->
    <path 
      d="M256 144 C330 148 394 175 394 246" 
      fill="none" 
      stroke="url(#metallicGold)" 
      stroke-width="8" 
      stroke-linecap="round" 
    />
    
    <!-- Cap Center Golden Pin -->
    <ellipse cx="256" cy="144" rx="14" ry="7" fill="url(#metallicGold)" stroke="#FFFFFF" stroke-width="2" />

    <!-- Tassel connector band -->
    <circle cx="394" cy="246" r="7" fill="#FFA751" />

    <!-- Solid gold hanging brush -->
    <path 
      d="M394 246 C387 278 382 295 389 328 C394 328 404 328 409 320 C405 295 401 278 394 246 Z" 
      fill="url(#metallicGold)" 
      stroke="#FFE259" 
      stroke-width="1.5"
    />

  </g>
</svg>

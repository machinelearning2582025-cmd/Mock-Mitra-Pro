<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Ultra deep space indigo blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181926" />
      <stop offset="40%" stop-color="#0E0F17" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Glassy/Glow outline gradient -->
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Porcelain White Top Cap Gradient -->
    <linearGradient id="whiteCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Cyber Cyan Logo Gradient -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Golden Rich Tassel Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="100%" stop-color="#FFA751" />
    </linearGradient>
    
    <!-- Secondary White Sheen for glossy overlay -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for the central elements to make them look 3D layered -->
    <filter id="shadow3D" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- PWA SQUARE/SQUIRCLE BACKGROUND -->
  <!-- Solid plate with a perfect inner gradient + border to avoid fading into wallpaper -->
  <rect 
    x="12" 
    y="12" 
    width="488" 
    height="488" 
    rx="124" 
    fill="url(#bgGrad)" 
    stroke="url(#glowBorder)" 
    stroke-width="12"
  />

  <!-- Subtle diagonal glass sheen overlay on background -->
  <path 
    d="M12 12 L500 12 L12 500 Z" 
    fill="url(#sheen)" 
    opacity="0.1" 
    pointer-events="none"
  />

  <!-- CENTRAL EMBLEM CONTAINER with Premium Drop Shadow -->
  <g filter="url(#shadow3D)">
    
    <!-- Outer Cyan Aura / Halo behind the logo elements for premium depth -->
    <circle cx="256" cy="256" r="130" fill="#00F2FE" opacity="0.08" filter="blur(20px)" />

    <!-- 1. THE GEOMETRIC "M" PILLARS (Beautifully structured and thick for extreme tiny-size contrast) -->
    <!-- Left side column of M -->
    <rect x="144" y="244" width="38" height="130" rx="10" fill="url(#cyberCyan)" />
    <!-- Right side column of M -->
    <rect x="330" y="244" width="38" height="130" rx="10" fill="url(#cyberCyan)" />
    
    <!-- The central dipping "V" component of the M -->
    <path 
      d="M164 244 L256 324 L348 244 L348 290 L256 372 L164 290 Z" 
      fill="url(#cyberCyan)" 
    />

    <!-- Secondary Accent Shadow element within the M connector -->
    <path 
      d="M182 244 L256 308 L330 244 L310 244 L256 288 L202 244 Z" 
      fill="#1E3B8A" 
      opacity="0.4"
    />

    <!-- 2. CAP BASE / SKULL CAP (Grounded on the M support) -->
    <path 
      d="M165 208 Q256 242 347 208 L347 236 Q256 272 165 236 Z" 
      fill="#2563EB" 
      stroke="#1E40AF" 
      stroke-width="1.5"
    />

    <!-- 3. GRADUATION CAP DIAMOND BOARD (Brilliant Pure Porcelain White - pops on ANY screen) -->
    <!-- Top shadow base -->
    <polygon 
      points="256,92 436,157 256,222 76,157" 
      fill="#0B0D13" 
      opacity="0.5"
    />
    <!-- Real 3D offset porcelain board -->
    <polygon 
      points="256,84 436,149 256,214 76,149" 
      fill="url(#whiteCap)" 
      stroke="#FFFFFF" 
      stroke-width="3.5"
    />

    <!-- Subtle elegant inner inset lines on white board -->
    <polygon 
      points="256,98 416,149 256,200 96,149" 
      fill="none" 
      stroke="#E2E8F0" 
      stroke-width="2" 
    />

    <!-- 4. TASSEL DETAILS (Glowing Golden Accent) -->
    <path 
      d="M256 149 C324 152 388 180 388 248" 
      fill="none" 
      stroke="url(#goldGrad)" 
      stroke-width="7" 
      stroke-linecap="round" 
    />
    
    <!-- Cap Button (Golden Center Pin) -->
    <ellipse cx="256" cy="149" rx="14" ry="7" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Tassel Fringe Ring -->
    <circle cx="388" cy="248" r="7" fill="#FFA751" />

    <!-- Tassel Fringe Brush (gorgeous hanging design) -->
    <path 
      d="M388 248 C381 278 376 295 383 325 C388 325 398 325 403 318 C399 295 395 278 388 248 Z" 
      fill="url(#goldGrad)" 
      stroke="#FFE259" 
      stroke-width="1.5"
    />

  </g>
</svg>
